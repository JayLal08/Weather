<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="icon/weather-app.ico">
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div class="background bg-default" id="background"></div>

  <!-- Location Permission Popup -->
  <div class="location-popup hidden" id="locationPopup">
    <div class="popup-content">
      <div class="popup-header">
        <h3>🌍 Enable Location Access</h3>
        <button class="close-btn" id="closePopup">×</button>
      </div>
      <div class="popup-body">
        <p>Allow location access to get weather forecast for your current location with detailed 5-day predictions!</p>
        <div class="popup-buttons">
          <button id="allowLocation" class="allow-btn">Allow Location</button>
          <button id="denyLocation" class="deny-btn">Maybe Later</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>🌤️ Weather Forecast</h1>
    
    <div class="search-container">
      <div class="search-box">
        <input type="text" placeholder="Search for a city..." id="cityinput">
        <div class="btn-group">
          <button id="add">Search</button>
        </div>
      </div>
    </div>

    <div class="weather-card hidden" id="weatherCard">
      <div class="city-header">
        <h2 id="cityoutput"></h2>
      </div>
      
      <div class="weather-main">
        <img id="weatherIcon" src="http://openweathermap.org/img/wn/01d@2x.png" alt="Weather Icon">
        <div id="temp"></div>
        <div id="description"></div>
      </div>

      <div class="weather-details">
        <div class="detail-item">
          <div class="detail-label">Humidity</div>
          <div class="detail-value" id="humidity">-</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Pressure</div>
          <div class="detail-value" id="pressure">-</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Wind Speed</div>
          <div class="detail-value" id="wind">-</div>
        </div>
      </div>
    </div>

    <div class="forecast-section hidden" id="forecastSection">
      <h2 class="forecast-title">5-Day Forecast</h2>
      <div id="forecast"></div>
    </div>

    <footer>
      © 2025 Jay Lalwani. All rights reserved.
    </footer>
  </div>
  <script src="./index.js"></script>
</body>
</html>
